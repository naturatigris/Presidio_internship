<h2>Index</h2>

<p>
  <a [routerLink]="['/category/create']">Create New</a>
</p>

<table class="table">
    <tbody>
  <tr>
    <th>Name</th>
    <th></th>
  </tr>
  <tr *ngFor="let item of categorylist">
    <td>{{ item.name }}</td>
    <td>
      <a [routerLink]="['/category/edit', item.categoryId]">Edit</a> |
      <a [routerLink]="['/category/details', item.categoryId]">Details</a> |
      <button class="buttonLink" (click)="deleteCategory(item.categoryId)">Delete</button>
    </td>
  </tr>
  </tbody>
</table>

<div class="clear"></div>
<div class="div-pagination">
  Page {{ currentPage }}/{{ totalPages }}
  <ng-container *ngIf="totalPages > 1">
    <button *ngFor="let page of [].constructor(totalPages); let i = index"
            [class.active]="currentPage === i + 1"
            (click)="goToPage(i + 1)">
      {{ i + 1 }}
    </button>
  </ng-container>
</div>
