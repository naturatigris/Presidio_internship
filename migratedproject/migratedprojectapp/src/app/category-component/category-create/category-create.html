
<form [formGroup]="categoryForm" (ngSubmit)="onSubmit()" enctype="multipart/form-data" class="form-horizontal">
   <h4>Category</h4>
        <hr />
  <div class="form-group">
    <label for="name" class="control-label col-md-2"> Name</label>
    <div class="col-md-10">
    <input type="text" formControlName="name" class="form-control" id="name" />
    <div class="text-danger" *ngIf="categoryForm.get('name')?.invalid && categoryForm.get('name')?.touched">
      Name is required.
    </div>
  </div>
  </div>

  <div class="form-group">  
    <button type="submit" class="btn btn-primary" [disabled]="categoryForm.invalid" class="col-md-offset-2 col-md-10">Create</button>
    </div>

</form>

<div >
  <a (click)="goBack()">Back to List</a>
</div>
