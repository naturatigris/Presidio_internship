<h2>Edit</h2>

<form (ngSubmit)="onSubmit()" [formGroup]="categoryForm" class="form-horizontal">
  <h4>Category</h4>
  <hr />

  <div *ngIf="formSubmitted && categoryForm.invalid" class="text-danger">
    Please fix the errors below.
  </div>

  <div class="form-group">
    <label class="control-label col-md-2" for="name">Name</label>
    <div class="col-md-10">
      <input
        id="name"
        type="text"
        class="form-control"
        formControlName="name"
      />
      <div
        class="text-danger"
        *ngIf="categoryForm.get('name')?.invalid && (categoryForm.get('name')?.touched || formSubmitted)"
      >
        Name is required.
      </div>
    </div>
  </div>

  <div class="form-group">
    <div class="col-md-offset-2 col-md-10">
      <button type="submit" class="btn btn-default">Save</button>
    </div>
  </div>
</form>

<div>
  <a [routerLink]="['/categories']">Back to List</a>
</div>
